name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://signalhub:signalhub@127.0.0.1:5432/signalhub_build
          SESSION_SECRET: 012345678901234567890123456789012345678901234567
          ENCRYPTION_KEY: 012345678901234567890123456789012345678901234567
      - run: npm audit --omit=dev --audit-level=high

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag signalhub:ci .

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # kubectl ships on GitHub runners; rendering catches broken manifests.
      - run: cp deploy/kubernetes/base/secrets.env.example deploy/kubernetes/base/secrets.env
      - run: kubectl kustomize deploy/kubernetes/base > /dev/null
      - run: kubectl kustomize deploy/kubernetes/with-postgres > /dev/null

  e2e:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: 012345678901234567890123456789012345678901234567
      ENCRYPTION_KEY: 012345678901234567890123456789012345678901234567
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up -d --build
      - run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3301/api/health/ready >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose logs
          exit 1
      - run: npm run test:e2e
      - if: always()
        run: docker compose down -v
