{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "status.fullname" . }}
  labels:
    {{- include "status.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl or secrets.existingSecret is required" .Values.secrets.databaseUrl | quote }}
  SESSION_SECRET: {{ required "secrets.sessionSecret or secrets.existingSecret is required" .Values.secrets.sessionSecret | quote }}
  SESSION_SIGNING_KEYS: {{ .Values.secrets.sessionSigningKeys | quote }}
  SESSION_ACTIVE_KEY_ID: {{ .Values.secrets.sessionActiveKeyId | quote }}
  ENCRYPTION_KEY: {{ required "secrets.encryptionKey or secrets.existingSecret is required" .Values.secrets.encryptionKey | quote }}
  ENCRYPTION_KEYS: {{ .Values.secrets.encryptionKeys | quote }}
  ENCRYPTION_ACTIVE_KEY_ID: {{ .Values.secrets.encryptionActiveKeyId | quote }}
  METRICS_TOKEN: {{ .Values.secrets.metricsToken | quote }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ .Values.secrets.otlpHeaders | quote }}
  S3_BUCKET: {{ .Values.secrets.s3Bucket | quote }}
  S3_REGION: {{ .Values.secrets.s3Region | quote }}
  S3_ENDPOINT: {{ .Values.secrets.s3Endpoint | quote }}
  S3_ACCESS_KEY_ID: {{ .Values.secrets.s3AccessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.secrets.s3SecretAccessKey | quote }}
{{- end }}
