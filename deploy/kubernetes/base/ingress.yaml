# Edit the host (and TLS secret / annotations for your ingress controller and
# cert-manager). The host must match NEXT_PUBLIC_APP_URL in config.env.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signalhub
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  rules:
    - host: status.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: signalhub-web, port: { name: http } } }
  tls:
    - hosts: [status.example.com]
      secretName: signalhub-tls
