apiVersion: apps/v1
kind: Deployment
metadata:
  name: signalhub-web
  labels: { app.kubernetes.io/component: web }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: { app.kubernetes.io/name: signalhub, app.kubernetes.io/component: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: signalhub, app.kubernetes.io/component: web }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1001, fsGroup: 1001, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        # Migrations (advisory-locked, safe with many replicas) and the first
        # administrator from STATUS_BOOTSTRAP_* when the database has no users.
        - name: prepare
          image: signalhub
          command: ["node", "dist-runtime/start.mjs", "--prepare"]
          envFrom: [{ secretRef: { name: signalhub-secrets } }, { configMapRef: { name: signalhub-config } }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      containers:
        - name: web
          image: signalhub
          command: ["node", "server.js"]
          ports: [{ name: http, containerPort: 3000 }]
          envFrom: [{ secretRef: { name: signalhub-secrets } }, { configMapRef: { name: signalhub-config } }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          readinessProbe: { httpGet: { path: /api/health/ready, port: http }, periodSeconds: 10, timeoutSeconds: 5 }
          livenessProbe: { httpGet: { path: /api/health/live, port: http }, periodSeconds: 20, timeoutSeconds: 5 }
          startupProbe: { httpGet: { path: /api/health/live, port: http }, failureThreshold: 30, periodSeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: signalhub, app.kubernetes.io/component: web }
---
apiVersion: v1
kind: Service
metadata:
  name: signalhub-web
spec:
  selector: { app.kubernetes.io/name: signalhub, app.kubernetes.io/component: web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: signalhub-web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: signalhub, app.kubernetes.io/component: web }
