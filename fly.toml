# Fly.io: `fly launch --copy-config --no-deploy`, then see docs/deploy/paas.md.
app = "signalhub"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  TRUST_PROXY_HEADERS = "true"

[http_service]
  internal_port = 3000
  force_https = true
  # The background worker runs in this machine: never scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/health/live"
    timeout = "5s"

# Holds the setup wizard's configuration and generated secrets. Not needed if
# DATABASE_URL, SESSION_SECRET and ENCRYPTION_KEY are set with `fly secrets`.
[[mounts]]
  source = "signalhub_data"
  destination = "/app/data"

[[vm]]
  memory = "1gb"
