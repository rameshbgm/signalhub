# Render Blueprint: one-click deploy with a managed PostgreSQL.
# https://render.com/docs/blueprint-spec
#
# Render generates the session and encryption secrets and wires DATABASE_URL.
# You are asked for the administrator password and public URL on first deploy.
services:
  - type: web
    name: signalhub
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 1c-2g # paid plan IDs are in https://render.com/docs/blueprint-spec. The worker runs in the same service and must stay awake, so not `free` (free instances spin down); 0.5c-512mb is the smallest paid plan
    healthCheckPath: /api/health/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signalhub-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false # e.g. https://signalhub.onrender.com or your custom domain
      - key: STATUS_BOOTSTRAP_PASSWORD
        sync: false # first administrator; changed at first sign-in
      - key: STATUS_BOOTSTRAP_EMAIL
        sync: false

databases:
  - name: signalhub-db
    databaseName: signalhub
    user: signalhub
    plan: 0.5c-1g # smallest comfortable size; 0.1c-256mb is enough for a trial
